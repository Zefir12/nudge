# nudge server: `docker compose -f deploy/compose.yml up -d`, then open http://<host>:8080.
services:
  nudge:
    image: registrydedic.zefirlabs.net/nudge:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Root-equivalent access to the host's Docker. No --privileged needed.
      - /var/run/docker.sock:/var/run/docker.sock
      - nudge-data:/data
      # Stacks at the same path on the host and in the container, so their relative
      # bind mounts (./data) work.
      - /opt/nudge/stacks:/opt/nudge/stacks
      # Docker's root dir, read-only: only the disk's size and free space are read
      # (NUDGE_DOCKER_ROOT; with another data-root, mount that one here).
      - /var/lib/docker:/host/docker:ro
    environment:
      NUDGE_STACKS_DIR: /opt/nudge/stacks

volumes:
  nudge-data:
