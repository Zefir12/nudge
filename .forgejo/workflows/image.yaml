# Builds the two images, one job each with the same tag: nudge (Dockerfile target
# `server`: frontend, then the Go binary with the frontend embedded) and nudge-agent
# (target `agent`).
# On a pull request it only builds, as a check, and only when the PR touches what the
# image build depends on beyond the code (ci.yaml already compiles and tests that). On a
# push to develop it also pushes it to the registry as `develop-<sha>` and `develop`; on
# a push to main (a merged release) as `main-<sha>` and `latest`; run by hand for a branch,
# it pushes `<branch>-<sha>` only.
# Jobs get no Docker socket, so kaniko builds the image: no daemon, no privileges, and
# it pushes straight to the registry.
name: image

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - backend/go.mod
      - backend/go.sum
      - frontend/package.json
      - frontend/package-lock.json
      - .forgejo/workflows/image.yaml
  workflow_dispatch: # push a branch's image to try it on a host

# Pull requests cancel their older builds; pushes for a branch queue up, so `develop`
# and `latest` end on the newest commit.
concurrency:
  group: image-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.target }})
    runs-on: docker
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: registrydedic.zefirlabs.net/nudge
          - target: agent
            image: registrydedic.zefirlabs.net/nudge-agent
    container:
      image: node:24.22.1@sha256:d862bb5d082c5ae0210ac07e8c0344cb8cf7bef6d78e9b8c50c179da923108ea # keep in sync with the Dockerfile
    env:
      IMAGE: ${{ matrix.image }}
      TARGET: ${{ matrix.target }}
      PUSH: ${{ forgejo.event_name != 'pull_request' }}

    steps:
      # Full history: scripts/version.sh counts merges (main included).
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # TAG is pushed on every run; MOVING is `develop` from develop and `latest` from a
      # push to main (a manual run on main pushes `main-<sha>` only). VERSION is the
      # binaries' version (vMAJOR.MINOR.PATCH), shown in the web UI.
      # The branch name comes in through env, never pasted into the script: a branch
      # named `$(...)` would otherwise run as shell.
      - name: Tag
        env:
          REF_NAME: ${{ forgejo.ref_name }}
          EVENT_NAME: ${{ forgejo.event_name }}
        run: |
          version=$(scripts/version.sh)
          echo "VERSION=$version" >> "$FORGEJO_ENV"
          branch=$(printf '%s\n' "$REF_NAME" | tr -c 'A-Za-z0-9_.\n-' '-')
          echo "TAG=$branch-$(git rev-parse --short=12 HEAD)" >> "$FORGEJO_ENV"
          if [ "$branch" = develop ]; then echo "MOVING=develop" >> "$FORGEJO_ENV"; fi
          if [ "$branch" = main ] && [ "$EVENT_NAME" = push ]; then
            echo "MOVING=latest" >> "$FORGEJO_ENV"
          fi

      # Runs in its own container with the workspace mounted. Credentials go into kaniko's
      # config only on the runs that push; pull requests build without pushing. The
      # Dockerfile's RUN steps run in this same container, so the shell drops the
      # credentials from its environment and execs kaniko in its place (PID 1), so
      # /proc/1/environ no longer holds them. config.json stays readable to them, which is why the Dockerfile
      # runs `npm ci --ignore-scripts`.
      - name: Build and push
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          entrypoint: /busybox/sh
          args: |
            -euc '
            if [ "$PUSH" = true ]; then
              auth=$(printf "%s:%s" "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d "\n");
              printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" "${IMAGE%%/*}" "$auth" > /kaniko/.docker/config.json;
              set -- --destination "$IMAGE:$TAG";
              if [ -n "${MOVING:-}" ]; then set -- "$@" --destination "$IMAGE:$MOVING"; fi;
            else
              set -- --no-push;
            fi;
            unset REGISTRY_USER REGISTRY_PASSWORD auth;
            exec /kaniko/executor --context "dir://$PWD" --dockerfile "$PWD/Dockerfile" --target "$TARGET" \
              --build-arg "VERSION=$VERSION" --single-snapshot "$@"
            '
