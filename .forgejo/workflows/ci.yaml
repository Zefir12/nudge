# Runs the same checks as `make test lint` (backend/ and frontend/). The Makefile wraps the
# tools in `docker run`, which the runner can't use (no Docker socket), so the jobs run
# them directly in the same images the Makefile uses.
# Go modules, Go's build cache and npm's download cache are kept in the runner's cache
# (actions/cache), keyed on the lock files. Entries are scoped to the PR that saved them,
# and ci doesn't run on develop, so a PR's first run starts cold and its later pushes reuse
# them. An entry isn't updated once saved: the build cache holds the dependencies, which
# is where most of the compile time goes, and our own packages are rebuilt each run.
name: ci

# Pull requests, plus pushes to main as the release check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go test -race)
    runs-on: docker
    timeout-minutes: 10
    container:
      image: golang:1.27.4 # keep in sync with backend/go.mod, Dockerfile and the Makefile
    defaults:
      run:
        working-directory: backend
    steps:
      # The Go image has no Node, which JavaScript actions such as checkout need.
      - name: Install Node for actions
        working-directory: /
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Go cache
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: go-test-${{ hashFiles('backend/go.sum') }}

      - name: Download modules
        run: go mod download

      # No separate `go build ./...`: go test compiles every package (each one is either
      # tested or imported by a test), and lint type-checks them all.
      - name: Tests
        run: go test -race ./...

      - name: Version script tests
        run: sh ../scripts/version_test.sh

  lint:
    name: lint (golangci-lint)
    runs-on: docker
    timeout-minutes: 10
    container:
      image: golangci/golangci-lint:v2.15.0 # keep in sync with the Makefile
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Install Node for actions
        working-directory: /
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Go and lint cache
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
            /root/.cache/golangci-lint
          key: go-lint-${{ hashFiles('backend/go.sum', 'backend/.golangci.yml') }}

      - name: Lint
        run: golangci-lint run ./...

  web:
    name: web (vp check, vue-tsc, vp test)
    runs-on: docker
    timeout-minutes: 10
    container:
      image: node:24.22.1 # keep in sync with the Makefile and Dockerfile
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # npm's download cache only; npm ci still installs node_modules from scratch.
      - name: npm cache
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Check (format, lint)
        run: npx vp check

      - name: Types
        run: npx vue-tsc --noEmit

      - name: Tests
        run: npx vp test run

      - name: Build
        run: npx vp build
